<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嵌入页面1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        .content {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            text-align: center;
        }

        p {
            line-height: 1.6;
            color: #666;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .image-item {
            text-align: center;
        }

        .image-item img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .image-item p {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="content">
        <h1>欢迎来到页面1</h1>
        <p>这是通过iframe嵌入的第一个示例页面。iframe是一种非常有用的HTML元素，它允许我们在一个网页中嵌入另一个网页或其他HTML文档。</p>

        <div class="image-grid">
            <div class="image-item">
                <img  
                       lazyload
                       alt="image"
                       data-src="/about/page1.html"
                         
                    alt="自然风景图片"
                 >
                <p>自然风景</p>
            </div>
            <div class="image-item">
                <img  
                       lazyload
                       alt="image"
                       data-src="/about/page1.html"
                          alt="城市建筑图片"
                 >
                <p>城市建筑</p>
            </div>
            <div class="image-item">
                <img  
                       lazyload
                       alt="image"
                       data-src="/about/page1.html"
                          alt="科技概念图片"
                 >
                <p>科技概念</p>
            </div>
        </div>

        <p>使用iframe的主要优点包括：</p>
        <ul>
            <li>轻松整合来自不同域的内容</li>
            <li>保持原有页面的设计和功能</li>
            <li>便于维护和更新特定部分的内容</li>
            <li>提高页面加载速度（异步加载）</li>
        </ul>
    </div>
</body>

</html>
