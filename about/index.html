<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            box-sizing: border-box;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            /* max-width: 1200px; */
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: #333;
            color: white;
            height: 100px;
            padding: 10px;
            text-align: center;
        }

        nav {
            display: flex;
            background: #f0f0f0;
            padding: 10px;
        }

        nav button {
            flex: 1;
            padding: 10px;
            border: none;
            background: #ddd;
            cursor: pointer;
            transition: all 0.3s;
        }

        nav button:hover {
            background: #ccc;
        }

        nav button.active {
            background: #667eea;
            color: white;
        }

        .iframe-container {
            position: relative;
            /* min-height: 100vh; */
            height: 75vh;
            border: 1px solid #ddd;
            margin: 15px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .controls {
            padding: 15px;
            text-align: center;
        }

        .controls input {
            width: 70%;
            padding: 10px;
            margin-right: 10px;
        }

        .controls button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            height: 30px;
            /* padding: 15px; */
            background: #f9f9f9;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>hello robot</h1>
            <p>机器人世界很丰富</p>
        </header>

        <nav>
            <button class="active" onclick="loadPage('index_inner.html')">test1</button>
            <button onclick="loadPage('page2.html')">test2</button>
            <button onclick="loadPage('pagevtkjs.html')">test3</button>
        </nav>

        <!-- <div class="controls">
            <input type="text" id="urlInput" placeholder="输入要嵌入的URL地址">
            <button onclick="loadCustomUrl()">加载自定义页面</button>
        </div> -->

        <div class="iframe-container">
            <iframe id="contentFrame" src="index_inner.html">
                您的浏览器不支持iframe，请升级浏览器或<a href="index_inner.html">点击这里查看内容</a>
            </iframe>
        </div>

        <footer>
            <p>日积跬步 | 不期速成</p>
        </footer>
    </div>

    <script>
        function loadPage(page) {
            document.getElementById('contentFrame').src = page;

            // 更新活动按钮状态
            const buttons = document.querySelectorAll('nav button');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function loadCustomUrl() {
            const url = document.getElementById('urlInput').value;
            if (url) {
                document.getElementById('contentFrame').src = url;
            } else {
                alert('请输入有效的URL地址');
            }
        }

        // 处理iframe加载事件
        document.getElementById('contentFrame').addEventListener('load', function () {
            console.log('iframe内容加载完成');
        });
    </script>
</body>

</html>
